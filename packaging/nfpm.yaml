# The .deb and .rpm a release attaches for each architecture, built by nfpm
# from a copy of the directory the tarball is made of (`stage`), so a package
# installs exactly the files the tarball carries, only where a distribution
# keeps them. The binary is static: one .deb and one .rpm per architecture
# serve every release of every distribution, with no dependencies to declare.
# packaging/package.sh sets VERSION and NFPM_ARCH (amd64 or arm64; nfpm calls
# the latter aarch64 in the .rpm); nfpm expands variables in fields like these,
# but not in `src` paths.
name: luthier
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: sound
priority: optional
maintainer: savashn <savashn@proton.me>
description: |
  DAW-agnostic command-line package manager for Linux audio software.
  Installs CLAP, VST3 and LV2 plugins and sample libraries into your home
  directory, from the Open Audio Stack registry.
homepage: https://github.com/savashn/luthier
license: LGPL-2.1-or-later

contents:
  - src: stage/luthier
    dst: /usr/bin/luthier
    file_info:
      mode: 0755

  - src: stage/luthier.1.gz
    dst: /usr/share/man/man1/luthier.1.gz

  - src: stage/completions/luthier.bash
    dst: /usr/share/bash-completion/completions/luthier
  # Debian's zsh reads vendor-completions; Fedora's and openSUSE's site-functions.
  - src: stage/completions/luthier.zsh
    dst: /usr/share/zsh/vendor-completions/_luthier
    packager: deb
  - src: stage/completions/luthier.zsh
    dst: /usr/share/zsh/site-functions/_luthier
    packager: rpm
  - src: stage/completions/luthier.fish
    dst: /usr/share/fish/vendor_completions.d/luthier.fish

  # Debian policy names the licence `copyright`; Fedora and openSUSE keep it
  # under licenses/.
  - src: stage/LICENSE
    dst: /usr/share/doc/luthier/copyright
    packager: deb
  - src: stage/LICENSE
    dst: /usr/share/licenses/luthier/LICENSE
    type: license
    packager: rpm
  # Plain files, not `type: doc`: nfpm leaves doc-typed files out of a .deb.
  - src: stage/README.md
    dst: /usr/share/doc/luthier/README.md
  - src: stage/CHANGELOG.md
    dst: /usr/share/doc/luthier/CHANGELOG.md
  - src: stage/SECURITY.md
    dst: /usr/share/doc/luthier/SECURITY.md

  # An rpm owns only the directories it lists, so without these, removing it
  # would leave both behind, empty. dpkg removes empty ones on its own.
  - dst: /usr/share/doc/luthier
    type: dir
    packager: rpm
  - dst: /usr/share/licenses/luthier
    type: dir
    packager: rpm
