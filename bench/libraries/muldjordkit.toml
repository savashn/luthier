schema = 1

id = "muldjordkit"
name = "MuldjordKit"
kind = "library"
category = "sample-library"
# Played by DrumGizmo or DrumCraker; engines.toml lists both, and either one
# satisfies the check. A dependency could only have named one of them.
content = ["drumgizmo"]
tags = ["drums", "drumgizmo"]

description = """
Multi-microphone acoustic kit recorded by Kenneth Muldjord, with a close and \
ambient microphone set. Plays in DrumGizmo or DrumCraker, both of which \
load the kit's XML file."""

homepage = "https://drumgizmo.org/wiki/doku.php?id=kits:muldjordkit"
repository = "https://drumgizmo.org/wiki/doku.php?id=kits"

authors = ["The DrumGizmo project"]

# Creative Commons Attribution 4.0, as stated on the kit's own wiki page.
[license]
kind = "open-source"
spdx = "CC-BY-4.0"

# Upstream calls this "3"; semver needs the minor and patch components.
[[releases]]
version = "3.0.0"

[[releases.artifacts]]
target = { os = "linux", arch = "x86_64" }
source = { type = "http", url = "https://drumgizmo.org/kits/MuldjordKit/MuldjordKit3.zip" }
archive = "zip"
size = 2536576789
checksum = { sha256 = "db94f910913185ee17c5abb77d285a27476dee979db0ccebdc7ed68404514c96" }
provides = ["library"]
install = [
  { format = "library", source = "MuldjordKit3", kind = "bundle" },
]
