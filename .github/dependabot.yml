# Weekly, grouped into one pull request per ecosystem, so an update is a
# thing to review rather than a stream of them. Every pull request still has
# to pass ci.yml, the MSRV job included, and deny.yml.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        # It sets the MSRV, and its last floor raise would have failed the
        # whole group, security fixes included. Alone, it holds back only itself.
        exclude-patterns: ["sevenz-rust2"]
    ignore:
      # Deliberate pin; see the comments in Cargo.toml and CLAUDE.md.
      - dependency-name: zip
        versions: [">=9"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Its refs name Rust toolchains, not releases of the action: `@1.93` in
      # ci.yml is the MSRV, and bumping it would retire the check it exists for.
      - dependency-name: dtolnay/rust-toolchain
