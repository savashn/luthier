# Weekly, grouped into one pull request per ecosystem, so an update is a
# thing to review rather than a stream of them. Every pull request still has
# to pass ci.yml, the MSRV job included, and deny.yml.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        # sevenz-rust2 sets the MSRV, and its last floor raise would have
        # failed the whole group, security fixes included; zip's majors change
        # its API, as 9 did. Alone, each holds back only itself.
        exclude-patterns: ["sevenz-rust2", "zip"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Its refs name Rust toolchains, not releases of the action: `@1.93` in
      # ci.yml is the MSRV, and bumping it would retire the check it exists for.
      - dependency-name: dtolnay/rust-toolchain
