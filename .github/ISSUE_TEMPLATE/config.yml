blank_issues_enabled: false
contact_links:
  - name: Add or correct a package
    url: https://github.com/savashn/luthier-extras/issues
    about: >
      Manifests live in the registry repository. A wrong checksum, a missing
      version or a package that should be listed goes there.

  - name: Report a security issue
    url: https://github.com/savashn/luthier/blob/main/SECURITY.md
    about: >
      Please report privately to the maintainers rather than in a public
      issue.
