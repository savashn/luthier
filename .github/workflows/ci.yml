name: ci

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  # On both architectures a release builds for: the release runs the suite on
  # each before it builds, so a test that only holds on x86_64 would otherwise
  # first fail on a tag. Both on Ubuntu 24.04, as the release builds are, so
  # the two differ only in architecture; move the pair to a newer release
  # together, here, in release.yml and in nix.yml.
  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Formatting, the feature-less build and the schema come out the same on
      # both architectures, so they run once; clippy and the suite run on both.
      - name: Format
        if: matrix.arch == 'x86_64'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The suite is fully offline: artifacts are generated at test time and
      # served over file://, and every test confines its paths to a temporary
      # root, so nothing can reach a real plugin directory.
      - name: Test
        run: cargo test --workspace

      # What keeps `luthier-manifest` free of async, HTTP and archive decoders:
      # built this way the tool pulls 70 crates instead of 164, which is the
      # configuration a bench's CI can afford. Nothing else asserts it, so an
      # import added under the default features would rot it unnoticed.
      - name: Registry tool builds without the authoring features
        if: matrix.arch == 'x86_64'
        run: cargo build -p luthier-registry-tool --no-default-features

      - name: Schema is up to date
        if: matrix.arch == 'x86_64'
        run: |
          cargo run -q -p luthier-registry-tool -- schema > /tmp/generated.json
          diff -u schemas/package-v1.json /tmp/generated.json

  # The release's packaging, on every change and on both architectures: a
  # release only runs it on a tag, and a broken nfpm.yaml or install.sh found
  # there leaves a tag without a release. The same scripts, from a debug build;
  # what is checked here is the packaging, and the release job checks the
  # static binary itself.
  package:
    name: Packaging (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Once: the scripts are the same on both architectures.
      - name: Shell scripts
        if: matrix.arch == 'x86_64'
        run: shellcheck -s sh packaging/*.sh

      # Only this architecture's tarball is there, so only its SHA-256 goes
      # into the script.
      - name: Package
        run: |
          cargo build --locked -p luthier-cli
          version=$(packaging/version.sh)
          packaging/package.sh target/debug/luthier "$version" "$ARCH-unknown-linux-gnu"
          packaging/install-script.sh "$version" "$ARCH"

      - name: The .deb installs and removes
        run: |
          sudo apt-get install -y "./luthier-$ARCH-linux.deb"
          luthier --version
          dpkg -L luthier | grep -qx /usr/share/man/man1/luthier.1.gz
          sudo apt-get remove -y luthier
          test ! -e /usr/bin/luthier

      # No repositories: the package has no dependencies, so their metadata
      # would only make the step slow and fail when a mirror does. Removing it
      # must leave none of its directories behind.
      - name: The .rpm installs and removes on Fedora
        run: |
          docker run --rm -v "$PWD:/o:ro" fedora:latest sh -ec "
            dnf install -y -q --disablerepo='*' /o/luthier-$ARCH-linux.rpm
            luthier --version
            dnf remove -y -q --disablerepo='*' luthier
            test ! -e /usr/share/doc/luthier && test ! -e /usr/share/licenses/luthier"

      # Served from file://, which the script allows only for a mirror or a
      # test; the SHA-256 written into it is checked all the same.
      - name: The install script installs and uninstalls
        run: |
          LUTHIER_RELEASE_URL="file://$PWD" sh install.sh
          ~/.local/bin/luthier --version
          sh install.sh --uninstall
          test ! -e ~/.local/bin/luthier

      # For the job below, which needs both architectures' tarballs.
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: luthier-${{ matrix.arch }}-linux.tar.gz
          if-no-files-found: error

  # What the release's publish job does with both architectures' tarballs: one
  # install.sh carrying both SHA-256s. It runs on each architecture, so each
  # half of the script installs the tarball it names.
  install-script:
    name: Install script for both architectures (${{ matrix.arch }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true
      - name: Write it and install with it
        run: |
          version=$(packaging/version.sh)
          packaging/install-script.sh "$version" x86_64 aarch64
          LUTHIER_RELEASE_URL="file://$PWD" sh install.sh
          ~/.local/bin/luthier --version

  # `rust-version = "1.93"` is a promise the README makes to anyone building
  # from source, and the job above runs on stable, so nothing else keeps it.
  # `check` rather than `test`: what can break is the language and std APIs a
  # newer compiler accepts, and checking the test targets covers them too.
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets --locked
