# A tagged release builds the binary the README tells people to download.
#
# The people this manager is for are musicians, and `cargo build --release`
# with a Rust 1.93 toolchain is not an install method for them (ROADMAP 0.3).
# What this publishes is one statically linked binary per architecture,
# x86_64 and aarch64, that runs on any Linux of that architecture, whatever its
# glibc, three ways: a tarball, a .deb and an .rpm with the same files where a
# distribution keeps them, and one install script that puts the right tarball
# in ~/.local. No checksum file goes beside them: GitHub publishes every
# asset's SHA-256 on the release itself, and the build provenance attestation
# covers the rest.
name: release

on:
  push:
    tags: ['v*']
  # Re-running a failed publish should not need a second tag.
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish.
        required: true

# The build jobs run the test suite and every crate's build script, so they
# get a read-only token; only `publish`, which runs neither, can write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # musl rather than glibc: a glibc binary carries the floor of whatever
  # machine built it, and "install this on Ubuntu 22.04 first" is not an
  # answer. Every C dependency in the tree — aws-lc-sys under rustls, liblzma,
  # bzip2 — ships musl support; they need a musl-targeting compiler, which is
  # what musl-tools provides on each architecture's runner.
  CC_x86_64_unknown_linux_musl: musl-gcc
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  CC_aarch64_unknown_linux_musl: musl-gcc
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  # The default bench travels with the release rather than as a branch
  # tarball of this repository: discovery walks whatever it is handed, so a
  # repository tarball would offer the workspace's own `Cargo.toml` files up
  # as manifests, and users would read whatever `main` held at that moment
  # rather than what a release published.
  BENCH_ASSET: bench.tar.gz

jobs:
  # Each architecture on a runner of its own kind, so its suite runs and its
  # binary generates the man page and completions natively, without emulation.
  # Both on Ubuntu 24.04, so the two builds use the same musl-tools; move them
  # to a newer release together. `publish` takes the architectures from what
  # this matrix delivered, so they are listed here alone.
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2

      - name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      # A tag that disagrees with the version the binary reports would put
      # `luthier --version` and the release page at odds forever afterwards,
      # and nothing downstream would catch it.
      - name: The tag and the workspace version agree
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(packaging/version.sh)
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match workspace version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      # A tag builds nothing the suite has not just passed on, on this
      # architecture. Run on the host target: what is being checked is the
      # code, not the libc.
      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p luthier-cli

      # The whole point of the musl build. A binary that quietly picked up a
      # dynamic libc would run here and fail on the machines this release
      # exists for.
      - name: The binary is static
        run: |
          binary="target/$TARGET/release/luthier"
          file "$binary"
          if ! ldd "$binary" 2>&1 | grep -qE 'statically linked|not a dynamic executable'; then
            echo "$binary is dynamically linked" >&2
            ldd "$binary" >&2
            exit 1
          fi

      # The tarball, the .deb and the .rpm for this architecture, by the
      # script CI also runs on every change. Their names carry no version, so
      # the README can name URLs under `releases/latest/download/` that stay
      # correct across releases; the version is inside, in the directory the
      # tarball unpacks to.
      - name: Package
        run: packaging/package.sh "target/$TARGET/release/luthier" "$version" "$TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: luthier-${{ matrix.arch }}
          path: luthier-${{ matrix.arch }}-linux.*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build provenance attestation: a short-lived OIDC token proves
      # to Sigstore which workflow, commit and repository produced the files.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: luthier-*
          merge-multiple: true

      # The build jobs have checked the tag against the workspace version. The
      # architectures are the ones whose tarball arrived: `publish` runs only
      # once every build has succeeded, and each uploads one.
      - name: Version and architectures
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_ENV"
          arches=
          for t in luthier-*-linux.tar.gz; do
            [ -e "$t" ] || continue
            t=${t#luthier-}
            arches="$arches ${t%-linux.tar.gz}"
          done
          [ -n "$arches" ] || { echo "::error::no tarball arrived from the builds"; exit 1; }
          echo "ARCHES=$arches" >> "$GITHUB_ENV"
          echo "architectures:$arches"

      # One script for every architecture: it picks the tarball for the
      # machine it runs on and checks it against the SHA-256 written in here.
      - name: Write the install script
        run: |
          # shellcheck disable=SC2086 # $ARCHES is a list of plain names
          packaging/install-script.sh "$version" $ARCHES

      # `bench` as the single top-level entry, which is the shape
      # `unwrap_single_root` was written for: the snapshot's paths then stay
      # the same across refreshes whatever the asset is called.
      - name: Package the bench
        run: |
          tar czf "$BENCH_ASSET" bench
          sha256sum "$BENCH_ASSET"

      # Build provenance, the standard way for a release on this forge to
      # say where its files came from. Signed through Sigstore with the
      # workflow's own identity, so there is no key to keep: anyone can check
      # that a download was built here, from this commit, by this workflow:
      #
      #     gh attestation verify luthier-x86_64-linux.tar.gz -R savashn/luthier
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            luthier-*-linux.*
            install.sh
            ${{ env.BENCH_ASSET }}

      # Release notes come from the changelog rather than from the tag
      # message: the changelog is the version of this that gets reviewed.
      - name: Extract the changelog section
        run: |
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat notes.md

      # Published straight away: nothing is signed by hand, so there is
      # nothing to wait for. The manager trusts the bench on HTTPS and on
      # this forge, as it trusts the binary itself.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          files="install.sh $BENCH_ASSET"
          for arch in $ARCHES; do
            files="$files luthier-$arch-linux.tar.gz luthier-$arch-linux.deb luthier-$arch-linux.rpm"
          done
          for f in $files; do
            [ -s "$f" ] || { echo "::error::$f is missing"; exit 1; }
          done
          if gh release view "$tag" > /dev/null 2>&1; then
            # A published release is what `releases/latest` serves. Changing
            # its files after the fact would change what users who already
            # downloaded it can check against; a fix goes out as a new tag.
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$tag is already published; cut a new tag rather than replacing its assets"
              exit 1
            fi
            # A draft left by an earlier, half-finished run is completed.
            gh release edit "$tag" --notes-file notes.md
            # shellcheck disable=SC2086 # $files is a list of plain names
            gh release upload "$tag" $files --clobber
            gh release edit "$tag" --draft=false
          else
            # shellcheck disable=SC2086
            gh release create "$tag" --title "$tag" --notes-file notes.md $files
          fi
