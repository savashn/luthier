# A tagged release builds the binary the README tells people to download.
#
# The people this manager is for are musicians, and `cargo build --release`
# with a Rust 1.89 toolchain is not an install method for them (ROADMAP 0.3).
# What this publishes is one statically linked binary that runs on any x86_64
# Linux, whatever its glibc, plus the checksum to check it against.
name: release

on:
  push:
    tags: ['v*']
  # Re-running a failed publish should not need a second tag.
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish.
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # musl rather than glibc: a glibc binary carries the floor of whatever
  # machine built it, and "install this on Ubuntu 22.04 first" is not an
  # answer. Every C dependency in the tree — aws-lc-sys under rustls, liblzma,
  # bzip2 — ships musl support; they need a musl-targeting compiler, which is
  # what musl-tools provides.
  TARGET: x86_64-unknown-linux-musl
  CC_x86_64_unknown_linux_musl: musl-gcc
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  # The asset name carries no version, so the README can name a URL under
  # `releases/latest/download/` that stays correct across releases. The
  # version is inside, in the directory the tarball unpacks to.
  ASSET: luthier-x86_64-linux.tar.gz
  # The default bench travels with the release rather than as a branch
  # tarball of this repository. Two reasons, and the second is the one that
  # settles it: discovery walks whatever it is handed, so a repository
  # tarball would offer the workspace's own `Cargo.toml` files up as
  # manifests; and a signature is fetched from the snapshot URL with `.sig`
  # appended, which nothing can publish under `/archive/refs/heads/`.
  BENCH_ASSET: bench.tar.gz

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      # A tag that disagrees with the version the binary reports would put
      # `luthier --version` and the release page at odds forever afterwards,
      # and nothing downstream would catch it.
      - name: The tag and the workspace version agree
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "luthier-cli") | .version')
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match workspace version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      # A tag builds nothing the suite has not just passed on. Run on the
      # host target: what is being checked is the code, not the libc.
      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p luthier-cli

      # The whole point of the musl build. A binary that quietly picked up a
      # dynamic libc would run here and fail on the machines this release
      # exists for.
      - name: The binary is static
        run: |
          binary="target/$TARGET/release/luthier"
          file "$binary"
          if ! ldd "$binary" 2>&1 | grep -qE 'statically linked|not a dynamic executable'; then
            echo "$binary is dynamically linked" >&2
            ldd "$binary" >&2
            exit 1
          fi

      # The binary generates its own man page and completions, so they cannot
      # drift from the arguments it actually accepts.
      - name: Package
        run: |
          binary="target/$TARGET/release/luthier"
          dir="luthier-$version-$TARGET"
          mkdir -p "$dir/completions"
          cp "$binary" "$dir/luthier"
          "$binary" man > "$dir/luthier.1"
          for shell in bash zsh fish; do
            "$binary" completions "$shell" > "$dir/completions/luthier.$shell"
          done
          cp LICENSE README.md CHANGELOG.md SECURITY.md "$dir/"
          tar czf "$ASSET" "$dir"
          sha256sum "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      # `bench` as the single top-level entry, which is the shape
      # `unwrap_single_root` was written for: the snapshot's paths then stay
      # the same across refreshes whatever the asset is called.
      - name: Package the bench
        run: |
          tar czf "$BENCH_ASSET" bench
          sha256sum "$BENCH_ASSET" > "$BENCH_ASSET.sha256"
          cat "$BENCH_ASSET.sha256"

      # Release notes come from the changelog rather than from the tag
      # message: the changelog is the version of this that gets reviewed.
      - name: Extract the changelog section
        run: |
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat notes.md

      # Created as a draft, and published by hand once the bench is signed.
      #
      # The manager ships with the bench's public key and requires a
      # signature from the very first fetch, so a published release without
      # `bench.tar.gz.sig` is a bench nobody can refresh. A draft is invisible
      # to `releases/latest`, which is the URL every client reads, so there is
      # no window between publishing and signing for anyone to fall into.
      - name: Publish as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            # Replacing the bench of a published release would leave the
            # signature users verify pointing at bytes that are gone, which
            # is a refusal no flag can relax. A fix goes out as a new tag.
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$tag is already published; cut a new tag rather than replacing its assets"
              exit 1
            fi
            # Re-running after a half-finished draft replaces the assets
            # rather than failing on a release that already exists.
            gh release edit "$tag" --notes-file notes.md
            gh release upload "$tag" \
              "$ASSET" "$ASSET.sha256" \
              "$BENCH_ASSET" "$BENCH_ASSET.sha256" --clobber
            # A signature over the bench this run just replaced verifies
            # nothing, so it goes with it.
            gh release delete-asset "$tag" "$BENCH_ASSET.sig" --yes 2> /dev/null || true
          else
            gh release create "$tag" --draft \
              --title "luthier $tag" \
              --notes-file notes.md \
              "$ASSET" "$ASSET.sha256" \
              "$BENCH_ASSET" "$BENCH_ASSET.sha256"
          fi

      # Signing is deliberately not done here. The key that vouches for the
      # bench should not live where a compromised workflow could reach it.
      - name: Say what is left to do
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "::notice::$tag is a draft. Sign the bench and publish it:"
          echo "  gh release download $tag -p $BENCH_ASSET"
          echo "  luthier-registry sign $BENCH_ASSET --key <secret key>"
          echo "  gh release upload $tag $BENCH_ASSET.sig"
          echo "  gh release edit $tag --draft=false"
