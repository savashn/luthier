# A tagged release builds the binary the README tells people to download.
#
# The people this manager is for are musicians, and `cargo build --release`
# with a Rust 1.93 toolchain is not an install method for them (ROADMAP 0.3).
# What this publishes is one statically linked binary that runs on any x86_64
# Linux, whatever its glibc, three ways: a tarball, a .deb and an .rpm with the
# same files where a distribution keeps them, and an install script that puts
# the tarball in ~/.local. No checksum file goes beside them: GitHub
# publishes every asset's SHA-256 on the release itself, and the build
# provenance attestation covers the rest.
name: release

on:
  push:
    tags: ['v*']
  # Re-running a failed publish should not need a second tag.
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish.
        required: true

permissions:
  contents: write
  # For the build provenance attestation: a short-lived OIDC token proves to
  # Sigstore which workflow, commit and repository produced the files.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  # musl rather than glibc: a glibc binary carries the floor of whatever
  # machine built it, and "install this on Ubuntu 22.04 first" is not an
  # answer. Every C dependency in the tree — aws-lc-sys under rustls, liblzma,
  # bzip2 — ships musl support; they need a musl-targeting compiler, which is
  # what musl-tools provides.
  TARGET: x86_64-unknown-linux-musl
  CC_x86_64_unknown_linux_musl: musl-gcc
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  # The asset name carries no version, so the README can name a URL under
  # `releases/latest/download/` that stays correct across releases. The
  # version is inside, in the directory the tarball unpacks to.
  ASSET: luthier-x86_64-linux.tar.gz
  DEB_ASSET: luthier-x86_64-linux.deb
  RPM_ASSET: luthier-x86_64-linux.rpm
  SCRIPT_ASSET: install.sh
  # The default bench travels with the release rather than as a branch
  # tarball of this repository: discovery walks whatever it is handed, so a
  # repository tarball would offer the workspace's own `Cargo.toml` files up
  # as manifests, and users would read whatever `main` held at that moment
  # rather than what a release published.
  BENCH_ASSET: bench.tar.gz

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      # A tag that disagrees with the version the binary reports would put
      # `luthier --version` and the release page at odds forever afterwards,
      # and nothing downstream would catch it.
      - name: The tag and the workspace version agree
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "luthier-cli") | .version')
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match workspace version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      # A tag builds nothing the suite has not just passed on. Run on the
      # host target: what is being checked is the code, not the libc.
      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p luthier-cli

      # The whole point of the musl build. A binary that quietly picked up a
      # dynamic libc would run here and fail on the machines this release
      # exists for.
      - name: The binary is static
        run: |
          binary="target/$TARGET/release/luthier"
          file "$binary"
          if ! ldd "$binary" 2>&1 | grep -qE 'statically linked|not a dynamic executable'; then
            echo "$binary is dynamically linked" >&2
            ldd "$binary" >&2
            exit 1
          fi

      # The tarball, the .deb, the .rpm and install.sh, by the script CI also
      # runs on every change.
      - name: Package
        run: packaging/package.sh "target/$TARGET/release/luthier" "$version" "$TARGET"

      # `bench` as the single top-level entry, which is the shape
      # `unwrap_single_root` was written for: the snapshot's paths then stay
      # the same across refreshes whatever the asset is called.
      - name: Package the bench
        run: |
          tar czf "$BENCH_ASSET" bench
          sha256sum "$BENCH_ASSET"

      # Build provenance, the standard way for a release on this forge to
      # say where its files came from. Signed through Sigstore with the
      # workflow's own identity, so there is no key to keep: anyone can check
      # that a download was built here, from this commit, by this workflow:
      #
      #     gh attestation verify luthier-x86_64-linux.tar.gz -R savashn/luthier
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ env.ASSET }}
            ${{ env.DEB_ASSET }}
            ${{ env.RPM_ASSET }}
            ${{ env.SCRIPT_ASSET }}
            ${{ env.BENCH_ASSET }}

      # Release notes come from the changelog rather than from the tag
      # message: the changelog is the version of this that gets reviewed.
      - name: Extract the changelog section
        run: |
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat notes.md

      # Published straight away: nothing is signed by hand, so there is
      # nothing to wait for. The manager trusts the bench on HTTPS and on
      # this forge, as it trusts the binary itself.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            # A published release is what `releases/latest` serves. Changing
            # its files after the fact would change what users who already
            # downloaded it can check against; a fix goes out as a new tag.
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$tag is already published; cut a new tag rather than replacing its assets"
              exit 1
            fi
            # A draft left by an earlier, half-finished run is completed.
            gh release edit "$tag" --notes-file notes.md
            gh release upload "$tag" "$ASSET" "$DEB_ASSET" "$RPM_ASSET" \
              "$SCRIPT_ASSET" "$BENCH_ASSET" --clobber
            gh release edit "$tag" --draft=false
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file notes.md \
              "$ASSET" "$DEB_ASSET" "$RPM_ASSET" "$SCRIPT_ASSET" "$BENCH_ASSET"
          fi
