# The part of validating extras that the test suite cannot do.
#
# `validate --strict` itself runs in `ci.yml`, because the suite covers it:
# `extras_passes_strict_validation` drives the real binary against
# `extras/` exactly as this used to. What is left is the sweep that needs the
# network, which no test is allowed to do.
name: extras

on:
  pull_request:
    paths:
      - 'extras/**'
      - 'crates/luthier-manifest/**'
      - 'crates/luthier-registry-tool/**'
      - '.github/workflows/extras.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  urls:
    name: Check artifact URLs
    runs-on: ubuntu-latest
    # Reachability depends on third-party hosts, so a failure here reports a
    # problem without blocking an otherwise valid change.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Saved on pull requests, unlike ci.yml's: this never runs on main, so
      # a pull request's own cache is the only one its next push can restore.
      - uses: Swatinem/rust-cache@v2

      # With the authoring features: --check-urls is one of the things they
      # are for. A debug build: the time goes on waiting for the hosts, and
      # an optimised build only makes the compile longer.
      - name: Check URLs
        run: cargo run -p luthier-registry-tool -- validate extras --check-urls
