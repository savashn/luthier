schema = 1

id = "drskit"
name = "DRSKit"
kind = "library"
category = "sample-library"
# Played by DrumGizmo or DrumCraker; engines.toml lists both, and either one
# satisfies the check. A dependency could only have named one of them.
content = ["drumgizmo"]
tags = ["drums", "drumgizmo"]

description = """
Multi-microphone acoustic kit recorded at DRS studios, with several velocity \
layers and round-robin variations per instrument. Plays in DrumGizmo or \
DrumCraker, both of which load the kit's XML file."""

homepage = "https://drumgizmo.org/wiki/doku.php?id=kits:drskit"
repository = "https://drumgizmo.org/wiki/doku.php?id=kits"

authors = ["The DrumGizmo project"]

# Creative Commons Attribution 4.0, as stated on the kit's own wiki page.
[license]
kind = "open-source"
spdx = "CC-BY-4.0"

# Upstream calls this "2.1"; semver needs the patch component.
[[releases]]
version = "2.1.0"

[[releases.artifacts]]
target = { os = "linux", arch = "x86_64" }
source = { type = "http", url = "https://drumgizmo.org/kits/DRSKit/DRSKit2_1.zip" }
archive = "zip"
size = 2803397710
checksum = { sha256 = "529f2dcad836593167d0cab218f125f591cd71199748fa681e05e3866667f090" }
provides = ["library"]
install = [
  { format = "library", source = "DRSKit", kind = "bundle" },
]
